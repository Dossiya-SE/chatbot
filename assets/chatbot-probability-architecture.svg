<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Chatbot API integration architecture</title><desc id="d">Visual showing Streamlit session state, API request, autoregressive probability as conceptual model mathematics, streamed response and privacy/evaluation boundaries.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#172238"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs><rect width="1600" height="720" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial"><text x="70" y="70" fill="#f1f6fb" font-size="31" font-weight="800">CHATBOT — API INTEGRATION, PROBABILITY &amp; EVALUATION BOUNDARIES</text><text x="70" y="102" fill="#a6b9cc" font-size="16">template-derived Streamlit integration · no claim of model training or production AI infrastructure</text>
<g font-size="13" font-weight="700"><rect x="70" y="160" width="220" height="110" rx="18" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/><text x="180" y="199" text-anchor="middle" fill="#fff">USER INPUT</text><text x="180" y="222" text-anchor="middle" fill="#bae6fd" font-size="11">st.chat_input</text><text x="180" y="243" text-anchor="middle" fill="#bae6fd" font-size="11">API key in password field</text><rect x="350" y="160" width="220" height="110" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="2"/><text x="460" y="199" text-anchor="middle" fill="#fff">SESSION STATE</text><text x="460" y="222" text-anchor="middle" fill="#e9d5ff" font-size="11">ordered role/content history</text><text x="460" y="243" text-anchor="middle" fill="#e9d5ff" font-size="11">rerun persistence</text><rect x="630" y="160" width="220" height="110" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="2"/><text x="740" y="199" text-anchor="middle" fill="#fff">API REQUEST</text><text x="740" y="222" text-anchor="middle" fill="#bbf7d0" font-size="11">chat.completions.create</text><text x="740" y="243" text-anchor="middle" fill="#bbf7d0" font-size="11">stream=True</text><rect x="910" y="160" width="250" height="110" rx="18" fill="#78350f" stroke="#fbbf24" stroke-width="2"/><text x="1035" y="199" text-anchor="middle" fill="#fff">MODEL SERVICE</text><text x="1035" y="222" text-anchor="middle" fill="#fde68a" font-size="11">external model endpoint</text><text x="1035" y="243" text-anchor="middle" fill="#fde68a" font-size="11">not implemented in this repo</text><rect x="1220" y="160" width="310" height="110" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="1375" y="199" text-anchor="middle" fill="#fff">STREAMED RESPONSE</text><text x="1375" y="222" text-anchor="middle" fill="#dce5ed" font-size="11">st.write_stream</text><text x="1375" y="243" text-anchor="middle" fill="#dce5ed" font-size="11">assistant message appended</text></g><path d="M290 215H350M570 215H630M850 215H910M1160 215H1220" stroke="#7dd3fc" stroke-width="3" marker-end="url(#a)"/>
<rect x="70" y="330" width="720" height="260" rx="20" fill="#101d31" stroke="#475569"/><text x="96" y="368" fill="#dbeafe" font-size="19" font-weight="700">Conceptual probability — mathematics of autoregressive generation</text><text x="96" y="414" fill="#eef2ff" font-size="18">p(y₁:ₜ | x) = ∏ₖ₌₁ᵀ p(yₖ | x, y₁:ₖ₋₁)</text><text x="96" y="450" fill="#a5b4fc" font-size="13">This equation describes a generic autoregressive factorization.</text><text x="96" y="475" fill="#a5b4fc" font-size="13">The repository does not implement model weights, training, attention kernels or inference internals.</text><g transform="translate(110 510)"><circle cx="35" cy="25" r="18" fill="#0c4a6e" stroke="#38bdf8"/><circle cx="120" cy="25" r="18" fill="#0c4a6e" stroke="#38bdf8"/><circle cx="205" cy="25" r="18" fill="#0c4a6e" stroke="#38bdf8"/><circle cx="290" cy="25" r="18" fill="#0c4a6e" stroke="#38bdf8"/><path d="M53 25H100M138 25H185M223 25H270" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a)"/><g fill="#fff" font-size="11"><text x="35" y="29" text-anchor="middle">y₁</text><text x="120" y="29" text-anchor="middle">y₂</text><text x="205" y="29" text-anchor="middle">…</text><text x="290" y="29" text-anchor="middle">yₜ</text></g></g>
<rect x="850" y="330" width="680" height="260" rx="20" fill="#101d31" stroke="#475569"/><text x="876" y="368" fill="#dbeafe" font-size="19" font-weight="700">Security, privacy &amp; evaluation boundary</text><g font-size="13" font-weight="700"><rect x="880" y="410" width="180" height="65" rx="13" fill="#4c0519" stroke="#fb7185"/><text x="970" y="438" text-anchor="middle" fill="#fff">SECRET HANDLING</text><text x="970" y="458" text-anchor="middle" fill="#fecdd3" font-size="10">no key commit</text><rect x="1090" y="410" width="180" height="65" rx="13" fill="#78350f" stroke="#fbbf24"/><text x="1180" y="438" text-anchor="middle" fill="#fff">PRIVACY</text><text x="1180" y="458" text-anchor="middle" fill="#fde68a" font-size="10">input may leave app</text><rect x="1300" y="410" width="200" height="65" rx="13" fill="#064e3b" stroke="#34d399"/><text x="1400" y="438" text-anchor="middle" fill="#fff">EVALUATION</text><text x="1400" y="458" text-anchor="middle" fill="#bbf7d0" font-size="10">task metrics required</text></g><text x="880" y="525" fill="#c9d4df" font-size="13">Implemented evidence: UI + session state + API call + streaming.</text><text x="880" y="551" fill="#9fb0c0" font-size="13">Not established: model training, RAG, agentic orchestration, safety evaluation or production readiness.</text><text x="70" y="662" fill="#9aaaba" font-size="14">The visual distinguishes application integration from the mathematics and infrastructure of the external model service.</text></g></svg>