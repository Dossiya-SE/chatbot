<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">Chatbot API integration architecture</title><desc id="desc">Adaptive light and dark visual separating implemented Streamlit API integration from conceptual autoregressive probability and external-model security, privacy and evaluation boundaries.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--source:#4338ca;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#7c3aed;--haz:#b91c1c;--iface:#7e22ce}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--source:#a5b4fc;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#a78bfa;--haz:#fb7185;--iface:#c084fc}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="720" rx="28"/><text x="70" y="70" class="fg" font-size="35" font-weight="800">CHATBOT — API INTEGRATION, PROBABILITY &amp; EVALUATION BOUNDARIES</text><text x="70" y="104" class="muted" font-size="16">Streamlit integration artifact · no claim of model training, inference internals, RAG, agents or production readiness</text><g transform="translate(70 160)" font-size="13" font-weight="700"><rect width="220" height="110" rx="18" fill="var(--obs)"/><text x="110" y="40" text-anchor="middle" fill="var(--bg)">USER INPUT</text><text x="110" y="65" text-anchor="middle" fill="var(--bg)" font-size="10">st.chat_input</text><text x="110" y="84" text-anchor="middle" fill="var(--bg)" font-size="10">secret entered at runtime</text><path d="M220 55H275" stroke="var(--muted)" marker-end="url(#a)"/><rect x="285" width="220" height="110" rx="18" fill="var(--iface)"/><text x="395" y="40" text-anchor="middle" fill="var(--bg)">SESSION STATE</text><text x="395" y="65" text-anchor="middle" fill="var(--bg)" font-size="10">ordered role/content history</text><text x="395" y="84" text-anchor="middle" fill="var(--bg)" font-size="10">rerun persistence</text><path d="M505 55H560" stroke="var(--muted)" marker-end="url(#a)"/><rect x="570" width="220" height="110" rx="18" fill="var(--viable)"/><text x="680" y="40" text-anchor="middle" fill="var(--bg)">API REQUEST</text><text x="680" y="65" text-anchor="middle" fill="var(--bg)" font-size="10">chat completion request</text><text x="680" y="84" text-anchor="middle" fill="var(--bg)" font-size="10">streaming enabled</text><path d="M790 55H845" stroke="var(--muted)" marker-end="url(#a)"/><rect x="855" width="250" height="110" rx="18" fill="var(--unc)"/><text x="980" y="40" text-anchor="middle" fill="var(--bg)">EXTERNAL MODEL</text><text x="980" y="65" text-anchor="middle" fill="var(--bg)" font-size="10">service endpoint</text><text x="980" y="84" text-anchor="middle" fill="var(--bg)" font-size="10">weights/internals external</text><path d="M1105 55H1160" stroke="var(--muted)" marker-end="url(#a)"/><rect x="1170" width="315" height="110" rx="18" fill="var(--state)"/><text x="1327" y="40" text-anchor="middle" fill="var(--bg)">STREAMED RESPONSE</text><text x="1327" y="65" text-anchor="middle" fill="var(--bg)" font-size="10">display stream</text><text x="1327" y="84" text-anchor="middle" fill="var(--bg)" font-size="10">assistant turn appended</text></g><rect x="70" y="330" width="720" height="260" rx="20" class="panel"/><text x="95" y="370" class="fg" font-size="20" font-weight="700">[S/M] Conceptual autoregressive probability</text><text x="95" y="420" class="fg math" font-size="22">p(y₁:ₜ|x)=∏ₖ₌₁ᵀp(yₖ|x,y₁:ₖ₋₁)</text><text x="95" y="457" class="muted" font-size="13">Generic factorization only. This repository does not implement training, attention kernels, weights, or model inference internals.</text><g transform="translate(110 505)"><circle cx="35" cy="25" r="18" fill="var(--obs)"/><circle cx="120" cy="25" r="18" fill="var(--obs)"/><circle cx="205" cy="25" r="18" fill="var(--obs)"/><circle cx="290" cy="25" r="18" fill="var(--obs)"/><path d="M53 25H100M138 25H185M223 25H270" stroke="var(--muted)" stroke-width="2" marker-end="url(#a)"/><g fill="var(--bg)" font-size="11"><text x="35" y="29" text-anchor="middle">y₁</text><text x="120" y="29" text-anchor="middle">y₂</text><text x="205" y="29" text-anchor="middle">…</text><text x="290" y="29" text-anchor="middle">yₜ</text></g></g><rect x="850" y="330" width="680" height="260" rx="20" class="panel"/><text x="875" y="370" class="fg" font-size="20" font-weight="700">Security, privacy &amp; evaluation boundary</text><rect x="880" y="415" width="180" height="65" rx="13" fill="var(--haz)"/><text x="970" y="443" text-anchor="middle" fill="var(--bg)" font-size="13" font-weight="700">SECRETS</text><text x="970" y="463" text-anchor="middle" fill="var(--bg)" font-size="10">never commit keys</text><rect x="1090" y="415" width="180" height="65" rx="13" fill="var(--unc)"/><text x="1180" y="443" text-anchor="middle" fill="var(--bg)" font-size="13" font-weight="700">PRIVACY</text><text x="1180" y="463" text-anchor="middle" fill="var(--bg)" font-size="10">input may leave app</text><rect x="1300" y="415" width="200" height="65" rx="13" fill="var(--viable)"/><text x="1400" y="443" text-anchor="middle" fill="var(--bg)" font-size="13" font-weight="700">EVALUATION</text><text x="1400" y="463" text-anchor="middle" fill="var(--bg)" font-size="10">task metrics required</text><text x="880" y="530" class="fg" font-size="13">Implemented: UI + session state + request + streaming.</text><text x="880" y="557" class="muted" font-size="13">Not established: model training, factuality, safety, domain accuracy, RAG, agents or production security.</text><text x="70" y="660" class="muted" font-size="14">Theme changes presentation only; the boundary between application integration and external model mathematics remains invariant.</text></svg>